name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install httpx mcp anyio
      - run: python3 -m py_compile server.py client.py
      - run: python3 -c "from client import FeedClient, run_sandbox; print('imports OK')"
